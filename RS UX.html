<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Rincon Creativo</title>
    <!-- Enlace al  JS externo -->
	<script src="RS UX.js"></script>
    <!-- Enlace al CSS externo -->
    <link rel="stylesheet" href="RS UX.css">
    <!-- Fuentes retro -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Fondo con textura granulada estilo años 2000 -->
    <div class="vintage-overlay"></div>

    <div class="login-container">
        <!-- Tarjeta principal inspirada en Metroflog -->
        <div class="metro-card">
            <!-- Cabecera con brillo retro -->
            <div class="cabecera-glow">
                <div class="titulo-wrapper">
                    <h1 class="metro-titulo">RINCON<span class="log-highlight">CREATIVO</span></h1>
                    <div class="subtitulo">· Para chavos, Que son chavos·</div>
                </div>
                <div class="badge-estrella"></div>
            </div>

            <!-- Formulario de login (solo diseño, sin acción) -->
            <form class="login-form">
                <div class="input-grupo">
                    <label for="username"><span class="icono">👤</span> NICK / EMAIL</label>
                    <input type="text" id="username" name="username" placeholder="ej: chica_glitter" autocomplete="off">
                    <div class="pixel-line"></div>
                </div>

                <div class="input-grupo">
                    <label for="password"><span class="icono">🔒</span> CONTRASEÑA</label>
                    <input type="password" id="password" name="password" placeholder="••••••••">
                    <div class="pixel-line"></div>
                </div>

                <div class="opciones-row">
                    <label class="checkbox-vintage">
                        <input type="checkbox"> <span>recordarme</span>
                    </label>
                    <a href="#" class="forgot-link">¿olvidaste tu pass?</a>
                </div>

                <button type="button" class="btn-ingresar">
                    <span class="btn-text">ENTRAR AL MURAL</span>
                    <span class="btn-glitch">✨</span>
                </button>

                <div class="registro-area">
                    <span class="linea-glow"></span>
                    <p>¿sin cuenta? <a href="#" class="signup-fake">crea tu cuenta→</a></p>
                    <div class="mensaje-sistema">● sistema listo ●</div>
                </div>
            </form>

            <!-- Footer con detalles vintage -->
            <div class="metro-footer">
                <div class="estado-online">
                    <span class="punto-verde"></span> 1,234 creativos activos
                </div>
                <div class="social-buttons-mini">
                    <span>🎧</span> <span>📼</span> <span>💿</span>
                </div>
            </div>
        </div>

        <!-- Elemento decorativo tipo cassette -->
        <div class="cassette-tape"></div>
    </div>
</body>
</html>
